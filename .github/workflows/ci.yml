name: Qualidade

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      AUTH_SECRET: test-only-auth-secret-32-characters
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: prisma-7-10-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
      - run: pnpm audit --prod --audit-level high
      - run: pnpm prisma:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=desktop
        env:
          E2E_USE_PRODUCTION: "true"
