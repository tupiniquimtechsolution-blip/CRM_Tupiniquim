name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      AUTH_SECRET: test-only-auth-secret-32-characters
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Materializar lockfile do patch de segurança Next.js
        if: github.ref == 'refs/heads/arena/q2-3b-correction-consent-opposition'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile já está sincronizado."
            exit 0
          fi
          git commit -m "build: refresh lockfile for Next.js 16.3.4 [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: pnpm audit --prod --audit-level high
      - run: pnpm prisma:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=desktop
        env:
          E2E_USE_PRODUCTION: "true"
